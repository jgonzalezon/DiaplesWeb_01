<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{Subject}}</title>
  <style>
    /* Estilos inline-friendly para email */
    body { margin:0; padding:0; background:#212222; color:#eee; font-family: Arial, Helvetica, sans-serif; }
    .wrap { width:100%; background:#0c1016; padding:24px 0; }
    .container { width:100%; max-width:640px; margin:0 auto; background:#0f151d; border-radius:16px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,.4); }
    .header { padding:16px 24px; background:#0f151d; text-align:center; }
    .logo { max-height:70px; }
    .hero img { width:100%; height:auto; display:block; }
    .content { padding:24px; }
    h1 { margin:0 0 12px; font-size:22px; line-height:1.3; color:#fff; }
    p  { margin:0 0 12px; color:#cfd6df; line-height:1.55; }
    .btn { display:inline-block; padding:12px 18px; border-radius:10px; background:#ff5555; color:#fff !important; text-decoration:none; font-weight:bold; }
    .btn:hover { filter:brightness(1.05); }
    .muted { color:#9aa3ad; font-size:12px; }
    .footer { padding:18px 24px; text-align:center; color:#9aa3ad; font-size:12px; }
    .card  { padding:18px; border-radius:12px; background:#0b1118; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); margin:16px 0; }
    @media (max-width:480px){ .content{ padding:18px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="container">
      <div class="header">
        <!-- logo inline por CID -->
        <img src="cid:logo" alt="Os Diaples d'a Uerba" class="logo">
      </div>

      <div class="content">
        <h1>{{Title}}</h1>
        <p>{{Intro}}</p>

        <div class="card">
          <p>{{Body}}</p>
        </div>

        <!-- botón opcional -->
        {{#Button}}
        <p style="margin-top:16px;">
          <a href="{{ButtonUrl}}" class="btn" target="_blank" rel="noopener">{{ButtonText}}</a>
        </p>
        {{/Button}}

        <p class="muted" style="margin-top:16px;">Si el botón no funciona, copia y pega este enlace en tu navegador:</p>
        <p class="muted">{{ButtonUrl}}</p>
      </div>

      <div class="footer">
        © {{Year}} · Os Diaples d'a Uerba · Zaragoza · <a href="https://www.diaples.es" style="color:#ff7777; text-decoration:none;">www.diaples.es</a>
      </div>
    </div>
  </div>
</body>
</html>
